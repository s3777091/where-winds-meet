services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: wwm_companion
      POSTGRES_USER: wwm
      POSTGRES_PASSWORD: wwm_local_dev
    ports:
      - "54329:5432"
    volumes:
      - wwm_postgres:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwm -d wwm_companion"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wwm_postgres:
